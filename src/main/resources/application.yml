server:
  port: 8081

spring:
  application:
    name: shortlink-service
  datasource:
    url: jdbc:h2:file:./data/shortlink;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration

shortlink:
  public-base-url: http://localhost:8081
  redirect-budget-millis: 300
  resolve:
    cache:
      max-size: 10000
      ttl-minutes: 10

logging:
  level:
    com.lab.shortlink: INFO
